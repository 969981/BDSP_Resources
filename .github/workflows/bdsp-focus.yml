name: BDSP focused master data and images
on:
  push:
    branches: [research/bdsp-unpack-20261126]
    paths: ['scripts/bdsp_focus.py', 'tests/test_bdsp_focus.py', '.github/workflows/bdsp-focus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            1.3.0/5146edd5f9d0579a488ea31d0610e859_NCA/1/Data/Managed/Metadata
            1.3.0/5146edd5f9d0579a488ea31d0610e859_NCA/1/Data/StreamingAssets/AssetAssistant/Pml
            1.3.0/5146edd5f9d0579a488ea31d0610e859_NCA/1/Data/StreamingAssets/AssetAssistant/Dpr
            1.3.0/5146edd5f9d0579a488ea31d0610e859_NCA/1/Data/StreamingAssets/AssetAssistant/Message
            1.3.0/5146edd5f9d0579a488ea31d0610e859_NCA/1/Data/StreamingAssets/AssetAssistant/UIs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install UnityPy==1.25.4 Pillow==13.0.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/bdsp_focus.py --output Unpack/v1.3.0/focus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdsp-focus-database
          path: |
            Unpack/v1.3.0/focus/*.sqlite
            Unpack/v1.3.0/focus/*.json
            Unpack/v1.3.0/focus/tables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdsp-pokemon-images
          path: Unpack/v1.3.0/focus/images/
          if-no-files-found: warn
